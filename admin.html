<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – Leads</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#333;font-family:"Proxima Nova",system-ui,Arial,sans-serif}
header{background:#ffe600;padding:12px 20px;display:flex;align-items:center;gap:10px;font-weight:700}header img{height:34px}
.w{max-width:640px;margin:0 auto;padding:20px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:16px;margin-bottom:10px}
.btn{border:0;border-radius:6px;background:#3483fa;color:#fff;font-weight:600;padding:11px 14px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.alt{background:#e3edfb;color:#3483fa}.btn.g{background:#00a650}.btn.r{background:#fff;color:#d93025;border:1px solid #f3c2bd}
.card{border:1px solid #eee;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.n{font-weight:700;font-size:17px}
.tag{font-size:12px;border-radius:99px;padding:3px 10px;font-weight:700;background:#ffe600}.tag.contatado{background:#d6e8ff}.tag.fechado{background:#c9f0d8}
.r1{font-size:14px;margin:3px 0}.r1 b{display:inline-block;min-width:100px;color:#777;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.err{color:#d93025;font-size:14px}.mut{color:#777;font-size:13px}
</style></head><body>
<header><img src="img/logo.jpg" style="border-radius:8px" alt="Logo do Ponto de Coleta" onerror="this.style.display='none'"> Painel de leads</header>
<div class="w">
<div id="login"><h2>Entrar</h2><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" id="go">Entrar</button><div class="err" id="e"></div></div>
<div id="app" style="display:none"><div class="top"><span class="mut" id="cnt"></span><span><button class="btn alt" id="rf">Atualizar</button> <button class="btn g" id="backup">Baixar JSON</button> <button class="btn alt" id="importBackup">Importar JSON</button> <button class="btn alt" id="out">Sair</button></span></div><input type="file" id="jsonFile" accept=".json,application/json" style="display:none"><div class="mut" id="backupInfo" style="margin:10px 0"></div><div id="list"></div></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},PW=sessionStorage.getItem("pw")||"";
function api(m,q,b){return fetch("/api/leads"+(q||""),{method:m,headers:{"x-admin-password":PW,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined})}
function dg(s){return String(s||"").replace(/\D/g,"")}
function dados(D){return [["Razão social",D.razao],["Natureza jurídica",D.natureza],["Porte",D.porte],["Faixa de faturamento",D.faixa],["Capital social",D.capital?"R$ "+D.capital:""],["Situação",D.situacao+(D.data_situacao?" desde "+D.data_situacao:"")],["Abertura",D.abertura],["CNAE principal",D.cnae],["Regime",[D.simples,D.mei].filter(Boolean).join(" · ")],["Endereço",D.endereco],["Telefone (Receita)",D.telefone],["E-mail (Receita)",D.email_receita],["Sócios",D.socios]].filter(function(x){return x[1]})}
function dadosCPF(d){return [["Status CPF",d.status],["Nome CPF",d.nome],["Nome da mãe",d.nome_mae],["Nascimento",d.data_nascimento],["Idade",d.idade==null?"":d.idade+" anos"],["Aniversário",d.aniversario],["Sexo",d.sexo]].filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=="")}
function qualificacao(l){var q=l.qualificacao||{};return {bancos:Array.isArray(l.bancos)?l.bancos:(q.bancos||[]),dispositivo:l.dispositivo||q.dispositivo||"",horario:l.horario||q.horario||""}}
function ficha(l){var q=qualificacao(l);return "FICHA – PONTO DE COLETA\nNome: "+l.nome+"\nCPF: "+l.cpf+"\nCNPJ: "+l.cnpj+"\nNegócio: "+l.fant+"\nCidade/UF: "+l.cid+"\nSegmento: "+l.seg+"\nEspaço: "+l.m2+"\nFaturamento: "+l.fat+"\nWhatsApp: "+l.zap+"\nE-mail: "+(l.mail||"-")+"\nBancos utilizados: "+q.bancos.join(", ")+"\nDispositivo: "+(q.dispositivo||"-")+"\nHorário preferido: "+(q.horario||"-")+"\nQUIZ:\n"+(l.quiz?String(l.quiz).split(" | ").join("\n"):"-")+(l.cpf_dados?"\n--- DADOS CPF ---\n"+dadosCPF(l.cpf_dados).map(x=>x[0]+": "+x[1]).join("\n"):"")+(l.cnpj_dados?"\n--- DADOS DA RECEITA ---\n"+dados(l.cnpj_dados).map(function(x){return x[0]+": "+x[1]}).join("\n"):"")+"\nData: "+new Date(l.created_at).toLocaleString("pt-BR")}
async function load(){var r=await api("GET");if(r.status==401){sessionStorage.removeItem("pw");$("login").style.display="block";$("app").style.display="none";$("e").textContent=PW?"Senha incorreta.":"";return}
 var d=await r.json();$("login").style.display="none";$("app").style.display="block";$("cnt").textContent=d.length+" lead(s)";var h=$("list");h.innerHTML="";
 d.forEach(function(l,i){var c=document.createElement("div");c.className="card";
  var t=document.createElement("div");t.className="top";var n=document.createElement("span");n.className="n";n.textContent="#"+(d.length-i)+" · "+l.nome;var g=document.createElement("span");g.className="tag "+l.status;g.textContent=l.status;t.appendChild(n);t.appendChild(g);c.appendChild(t);
  var q=qualificacao(l);
  [["CPF",l.cpf],["CNPJ",l.cnpj],["Negócio",l.fant],["Cidade",l.cid],["Segmento",l.seg],["Espaço",l.m2],["Faturamento",l.fat],["WhatsApp",l.zap],["E-mail",l.mail||"-"],["Bancos utilizados",q.bancos.join(", ")||"-"],["Dispositivo / sistema",q.dispositivo||"-"],["Horário preferido",q.horario||"-"],["Recebido",new Date(l.created_at).toLocaleString("pt-BR")]].forEach(function(x){var p=document.createElement("div");p.className="r1";var b=document.createElement("b");b.textContent=x[0];p.appendChild(b);p.appendChild(document.createTextNode(x[1]));c.appendChild(p)});
  if(l.quiz){var qv=document.createElement("div");qv.style.cssText="background:#fffbd1;border-radius:10px;padding:10px 12px;margin-top:10px";var qh=document.createElement("div");qh.style.cssText="font-weight:700;margin-bottom:4px";qh.textContent="Respostas do quiz";qv.appendChild(qh);String(l.quiz).split(" | ").forEach(function(x){var p=document.createElement("div");p.className="r1";p.textContent=x;qv.appendChild(p)});c.appendChild(qv)}
  if(l.cpf_dados){var cv=document.createElement("div");cv.className="card";var ch=document.createElement("strong");ch.textContent="Consulta CPF (somente admin)";cv.appendChild(ch);dadosCPF(l.cpf_dados).forEach(function(x){var rr=document.createElement("div");rr.className="r1";var bb=document.createElement("b");bb.textContent=x[0];rr.appendChild(bb);rr.appendChild(document.createTextNode(String(x[1])));cv.appendChild(rr)});c.appendChild(cv)}
  if(l.cnpj_dados){var dv=document.createElement("div");dv.style.cssText="background:#f7f7f7;border-radius:10px;padding:10px 12px;margin-top:10px";var ht=document.createElement("div");ht.style.cssText="font-weight:700;margin-bottom:4px";ht.textContent="Dados da Receita (CNPJ)";dv.appendChild(ht);dados(l.cnpj_dados).forEach(function(x){var p=document.createElement("div");p.className="r1";var b=document.createElement("b");b.textContent=x[0];p.appendChild(b);p.appendChild(document.createTextNode(x[1]));dv.appendChild(p)});c.appendChild(dv)}
  var w=document.createElement("div");w.className="row";
  function B(tx,cls,fn){var b=document.createElement("button");b.className="btn "+cls;b.textContent=tx;b.onclick=fn;w.appendChild(b)}
  B("Copiar ficha","",async function(e){try{await navigator.clipboard.writeText(ficha(l));e.target.textContent="Copiado ✓"}catch(x){prompt("Copie:",ficha(l))}});
  var a=document.createElement("a");a.className="btn g";a.textContent="WhatsApp";a.target="_blank";a.rel="noopener";a.href="https://wa.me/55"+dg(l.zap)+"?text="+encodeURIComponent("Olá "+String(l.nome).split(" ")[0]+", vi seu cadastro para ser ponto de coleta.");w.appendChild(a);
  B("Contatado","alt",async function(){await api("PATCH","?id="+l.id,{status:"contatado"});load()});
  B("Fechado","alt",async function(){await api("PATCH","?id="+l.id,{status:"fechado"});load()});
  B("Excluir","r",async function(){if(confirm("Excluir este lead?")){await api("DELETE","?id="+l.id);load()}});
  c.appendChild(w);h.appendChild(c)})}
$("go").onclick=function(){PW=$("pw").value;sessionStorage.setItem("pw",PW);load()};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("rf").onclick=load;$("out").onclick=function(){sessionStorage.removeItem("pw");PW="";load()};
$("backup").onclick=async function(){
 try {var r=await fetch("/api/backup",{headers:{"x-admin-password":PW}});if(!r.ok)throw Error("Não foi possível baixar o backup ("+r.status+")");
 var blob=await r.blob(),a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download="fichas-coleta-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);$("backupInfo").textContent="Backup baixado. Guarde o arquivo em local privado e protegido.";
 }catch(e){$("backupInfo").textContent=e.message}
};
$("importBackup").onclick=function(){$("jsonFile").click()};
$("jsonFile").onchange=async function(){var file=this.files&&this.files[0];if(!file)return;
 try {if(file.size>3*1024*1024)throw Error("Arquivo grande demais. Divida em lotes menores.");var obj=JSON.parse(await file.text());if(obj.format!=="coleta-fichas-v1"||!Array.isArray(obj.leads))throw Error("Backup JSON inválido.");
 if(!confirm("Importar "+obj.leads.length+" fichas? CPF ou CNPJ repetidos serão ignorados."))return;
 var totals={imported:0,duplicates:0,invalid:0};$("backupInfo").textContent="Importando...";
 for(var i=0;i<obj.leads.length;i+=100){var r=await fetch("/api/backup",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":PW},body:JSON.stringify({format:"coleta-fichas-v1",leads:obj.leads.slice(i,i+100)})});var d=await r.json();if(!r.ok)throw Error("Falha na importação ("+r.status+"). Já importadas: "+totals.imported);Object.keys(totals).forEach(k=>totals[k]+=d[k]||0)}
 $("backupInfo").textContent="Importadas: "+totals.imported+" | Repetidas: "+totals.duplicates+" | Inválidas: "+totals.invalid;await load();
 }catch(e){$("backupInfo").textContent=e.message}finally{this.value=""}
};
if(PW)load();
</script></body></html>
